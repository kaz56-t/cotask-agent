version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cotask-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv  # Python仮想環境を除外
      - ./backend/data:/app/data  # データベースファイルの永続化
    env_file:
      - .env  # .envファイルを環境変数として読み込む
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - cotask-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cotask-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # node_modulesを除外
      - /app/.next  # Next.jsのビルドキャッシュを除外
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true  # Windowsでのファイル監視対応
    networks:
      - cotask-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  cotask-network:
    driver: bridge
